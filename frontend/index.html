<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Empodérate Vecino — RRHH</title>
  <link rel="icon" href="data:," />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-slate-100 min-h-screen" x-data="app()" x-init="init()">

  <div id="boot-msg" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f1f5f9;z-index:50;padding:1rem;">
    <div style="max-width:460px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px;font-family:sans-serif;color:#334155;font-size:14px;">
      <strong>Cargando sistema…</strong>
      <p style="margin:8px 0 0;" id="boot-detail">Si este mensaje no desaparece, abajo aparecerá la causa.</p>
    </div>
  </div>

  <!-- =================== RESTABLECER CONTRASEÑA =================== -->
  <template x-if="ready && showReset">
    <div class="min-h-screen flex items-center justify-center p-4">
      <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md">
        <div class="text-center mb-6">
          <img src="assets/logo.png" alt="Empodérate Vecino" class="h-20 mx-auto mb-3" onerror="this.style.display='none'" />
          <h1 class="text-xl font-bold text-slate-800">Nueva contraseña</h1>
          <p class="text-slate-500 mt-1">Crea una contraseña segura para tu cuenta.</p>
        </div>
        <form @submit.prevent="saveNewPassword" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Nueva contraseña</label>
            <input type="password" x-model="newPass" required
              class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500" />
          </div>
          
          <div class="mb-2">
            <div class="flex gap-1 mb-2">
              <div class="h-2 flex-1 rounded-full transition-all" 
                :class="passwordChecks.length ? 'bg-green-500' : 'bg-slate-200'"></div>
              <div class="h-2 flex-1 rounded-full transition-all" 
                :class="passwordChecks.upper ? 'bg-green-500' : 'bg-slate-200'"></div>
              <div class="h-2 flex-1 rounded-full transition-all" 
                :class="passwordChecks.lower ? 'bg-green-500' : 'bg-slate-200'"></div>
              <div class="h-2 flex-1 rounded-full transition-all" 
                :class="passwordChecks.number ? 'bg-green-500' : 'bg-slate-200'"></div>
              <div class="h-2 flex-1 rounded-full transition-all" 
                :class="passwordChecks.special ? 'bg-green-500' : 'bg-slate-200'"></div>
            </div>
          </div>

          <ul class="text-xs space-y-1 mb-4">
            <li class="flex items-center gap-2" :class="passwordChecks.length ? 'text-green-600' : 'text-slate-500'">
              <span x-text="passwordChecks.length ? '✓' : '○'"></span>
              Mínimo 8 caracteres
            </li>
            <li class="flex items-center gap-2" :class="passwordChecks.upper ? 'text-green-600' : 'text-slate-500'">
              <span x-text="passwordChecks.upper ? '✓' : '○'"></span>
              Al menos una letra MAYÚSCULA
            </li>
            <li class="flex items-center gap-2" :class="passwordChecks.lower ? 'text-green-600' : 'text-slate-500'">
              <span x-text="passwordChecks.lower ? '✓' : '○'"></span>
              Al menos una letra minúscula
            </li>
            <li class="flex items-center gap-2" :class="passwordChecks.number ? 'text-green-600' : 'text-slate-500'">
              <span x-text="passwordChecks.number ? '✓' : '○'"></span>
              Al menos un número
            </li>
            <li class="flex items-center gap-2" :class="passwordChecks.special ? 'text-green-600' : 'text-slate-500'">
              <span x-text="passwordChecks.special ? '✓' : '○'"></span>
              Al menos un carácter especial (!@#$%...)
            </li>
          </ul>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Confirmar contraseña</label>
            <input type="password" x-model="newPass2" required
              class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500" />
            <p class="text-xs mt-1" 
              :class="passwordChecks.match ? 'text-green-600' : 'text-red-600'"
              x-show="newPass2.length > 0"
              x-text="passwordChecks.match ? '✓ Las contraseñas coinciden' : '✗ Las contraseñas no coinciden'"></p>
          </div>

          <div x-show="resetMsg" x-text="resetMsg" class="bg-red-50 text-red-700 text-sm p-3 rounded-lg"></div>
          
          <button type="submit" 
            :disabled="!isPasswordValid"
            :class="isPasswordValid ? 'bg-blue-600 hover:bg-blue-700' : 'bg-slate-300 cursor-not-allowed'"
            class="w-full text-white py-2 rounded-lg font-medium transition-colors">
            Guardar contraseña
          </button>
        </form>
      </div>
    </div>
  </template>

    <!-- =================== RECUPERAR CONTRASEÑA =================== -->
  <template x-if="ready && !session && !showReset && forgotMode">
    <div class="min-h-screen flex items-center justify-center p-4">
      <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md">
        <div class="text-center mb-6">
          <img src="assets/logo.png" alt="Empodérate Vecino" class="h-20 mx-auto mb-3" onerror="this.style.display='none'" />
          <h1 class="text-xl font-bold text-slate-800">Recuperar contraseña</h1>
          <p class="text-slate-500 mt-1">Escribe tu correo y te enviaremos un enlace para crear una nueva contraseña.</p>
        </div>
        <form @submit.prevent="forgot()" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Correo</label>
            <input type="email" x-model="email" required
              class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500" />
          </div>
          <div x-show="errorMsg" x-text="errorMsg" class="bg-red-50 text-red-700 text-sm p-3 rounded-lg"></div>
          <button type="submit" :disabled="forgotLoading"
            class="w-full bg-blue-600 text-white py-2 rounded-lg font-medium hover:bg-blue-700 disabled:bg-slate-400">
            <span x-text="forgotLoading ? 'Enviando...' : 'Enviar'"></span>
          </button>
          <button type="button" @click="cancelForgot()"
            class="w-full bg-slate-200 text-slate-700 py-2 rounded-lg font-medium hover:bg-slate-300">
            Volver al login
          </button>
        </form>
      </div>
    </div>
  </template>

  <!-- =================== LOGIN =================== -->
  <template x-if="ready && !session && !showReset && !forgotMode">
    <div class="min-h-screen flex items-center justify-center p-4">
      <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md">
        <div class="text-center mb-6">
          <img src="assets/logo.png" alt="Empodérate Vecino" class="h-20 mx-auto mb-3" onerror="this.style.display='none'" />
          <h1 class="text-2xl font-bold text-slate-800">Empodérate Vecino</h1>
          <p class="text-slate-500 mt-1">Sistema de Gestión de Voluntariado</p>
        </div>
        <div x-show="configError" x-text="configError"
             class="bg-amber-50 border border-amber-300 text-amber-800 text-sm p-3 rounded-lg mb-4"></div>
        <form @submit.prevent="login()" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Correo</label>
            <input type="email" x-model="email" required
              class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
            <input type="password" x-model="password" required
              class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500" />
          </div>
          <div x-show="errorMsg" x-text="errorMsg" class="bg-red-50 text-red-700 text-sm p-3 rounded-lg"></div>
          <div x-show="infoMsg" x-text="infoMsg" class="bg-green-50 text-green-700 text-sm p-3 rounded-lg"></div>
          <button type="submit" :disabled="loading"
            class="w-full bg-blue-600 text-white py-2 rounded-lg font-medium hover:bg-blue-700 disabled:bg-slate-400">
            <span x-text="loading ? 'Ingresando...' : 'Ingresar'"></span>
          </button>
          <div class="text-center">
            <button type="button" @click="forgotMode = true; errorMsg = ''; infoMsg = ''"
              class="text-sm text-blue-600 underline">
              ¿Olvidaste tu contraseña?
            </button>
          </div>
        </form>
      </div>
    </div>
  </template>
  <!-- =================== APP =================== -->
  <template x-if="ready && session && !showReset">
    <div class="min-h-screen">
      <header class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
          <div class="flex items-center gap-3">
            <img src="assets/logo.png" alt="" class="h-9" onerror="this.style.display='none'" />
            <div>
              <h1 class="text-lg font-bold text-slate-800">Empodérate Vecino</h1>
              <p class="text-xs text-slate-500"
                 x-text="profile ? ('Rol: ' + profile.app_role + (myCommission ? ' — ' + myCommission.commissions.name : '')) : ''"></p>
            </div>
          </div>
          <button @click="logout" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1 rounded-lg text-sm">Salir</button>
        </div>
      </header>

      <main class="max-w-7xl mx-auto px-4 py-6">

        <div x-show="notice" x-text="notice"
             :class="noticeType === 'ok' ? 'bg-green-50 text-green-700 border-green-300' : 'bg-red-50 text-red-700 border-red-300'"
             class="border p-3 rounded-lg mb-4 text-sm"></div>

        <!-- ============ PANEL RRHH ============ -->
        <template x-if="myRole === 'rrhh'">
          <div>
            <div class="flex flex-wrap gap-2 mb-4">
              <button @click="view='vol'; pageVol=1" :class="view==='vol' ? 'bg-blue-600 text-white' : 'bg-white'" class="px-4 py-2 rounded-lg text-sm font-medium shadow">Personas</button>
              <button @click="view='rep'; pageHours=1; $nextTick(() => renderChart())" :class="view==='rep' ? 'bg-blue-600 text-white' : 'bg-white'" class="px-4 py-2 rounded-lg text-sm font-medium shadow">Horas registradas</button>
              <button @click="view='cert'" :class="view==='cert' ? 'bg-blue-600 text-white' : 'bg-white'" class="px-4 py-2 rounded-lg text-sm font-medium shadow">Constancias</button>
            </div>

            <div x-show="view==='vol'" class="flex justify-end mb-3">
              <button @click="newPerson()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm">＋ Nueva persona</button>
            </div>

            <div x-show="view==='vol' && showPersonForm" class="bg-white rounded-lg shadow p-4 mb-4 grid grid-cols-1 md:grid-cols-2 gap-3 text-sm">
              <h3 class="md:col-span-2 font-bold text-slate-700" x-text="personForm.id ? 'Editar / completar ficha' : 'Alta de persona'"></h3>
              <div><label class="block font-medium text-slate-700 mb-1">Nombres *</label>
                <input x-model="personForm.nombres" class="w-full border border-slate-300 rounded-lg p-2" /></div>
              <div><label class="block font-medium text-slate-700 mb-1">Apellidos *</label>
                <input x-model="personForm.apellidos" class="w-full border border-slate-300 rounded-lg p-2" /></div>
              <div><label class="block font-medium text-slate-700 mb-1">Comisión *</label>
                <select x-model="personForm.commission_id" class="w-full border border-slate-300 rounded-lg p-2">
                  <option value="">-- Selecciona --</option>
                  <template x-for="c in commissions" :key="c.id">
                    <option :value="c.id" x-text="c.name"></option>
                  </template>
                </select></div>
              <div><label class="block font-medium text-slate-700 mb-1">Rol interno</label>
                <input x-model="personForm.internal_role" class="w-full border border-slate-300 rounded-lg p-2" placeholder="Ej: Voluntario de Proyectos" /></div>
              <div><label class="block font-medium text-slate-700 mb-1">Teléfono</label>
                <input x-model="personForm.phone" class="w-full border border-slate-300 rounded-lg p-2" placeholder="51 999 999 999" /></div>
              <div><label class="block font-medium text-slate-700 mb-1">Correo</label>
                <input type="email" x-model="personForm.email" class="w-full border border-slate-300 rounded-lg p-2" /></div>
              <div><label class="block font-medium text-slate-700 mb-1">Carrera / especialización</label>
                <input x-model="personForm.career" class="w-full border border-slate-300 rounded-lg p-2" /></div>
              <div><label class="block font-medium text-slate-700 mb-1">Fecha de ingreso</label>
                <input type="date" x-model="personForm.admission_date" :max="today" class="w-full border border-slate-300 rounded-lg p-2" /></div>

              <template x-if="fullForm">
                <div class="md:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-3 border-t pt-3 mt-1">
                  <h4 class="md:col-span-2 font-semibold text-slate-500 text-xs uppercase">Ficha completa</h4>
                  <div><label class="block font-medium text-slate-700 mb-1">DNI / Documento</label>
                    <input x-model="personForm.dni" class="w-full border border-slate-300 rounded-lg p-2" /></div>
                  <div><label class="block font-medium text-slate-700 mb-1">Ciudad, provincia y distrito</label>
                    <input x-model="personForm.city" class="w-full border border-slate-300 rounded-lg p-2" /></div>
                  <div><label class="block font-medium text-slate-700 mb-1">Fecha de nacimiento</label>
                    <input type="date" x-model="personForm.birth_date" class="w-full border border-slate-300 rounded-lg p-2" /></div>
                  <div><label class="block font-medium text-slate-700 mb-1">Nivel de estudios</label>
                    <input x-model="personForm.education_level" class="w-full border border-slate-300 rounded-lg p-2" /></div>
                  <div><label class="block font-medium text-slate-700 mb-1">Institución educativa</label>
                    <input x-model="personForm.institution" class="w-full border border-slate-300 rounded-lg p-2" /></div>
                  <div><label class="block font-medium text-slate-700 mb-1">¿Trabaja?</label>
                    <input x-model="personForm.works" class="w-full border border-slate-300 rounded-lg p-2" placeholder="Si / No" /></div>
                  <div><label class="block font-medium text-slate-700 mb-1">Alergias o afines</label>
                    <input x-model="personForm.allergies" class="w-full border border-slate-300 rounded-lg p-2" /></div>
                  <div><label class="block font-medium text-slate-700 mb-1">EPS o seguro</label>
                    <input x-model="personForm.insurance" class="w-full border border-slate-300 rounded-lg p-2" /></div>
                  <div><label class="block font-medium text-slate-700 mb-1">Contacto de emergencia</label>
                    <input x-model="personForm.emergency_contact" class="w-full border border-slate-300 rounded-lg p-2" /></div>
                  <div><label class="block font-medium text-slate-700 mb-1">Parentesco</label>
                    <input x-model="personForm.emergency_relationship" class="w-full border border-slate-300 rounded-lg p-2" /></div>
                  <div><label class="block font-medium text-slate-700 mb-1">Teléfono de emergencia</label>
                    <input x-model="personForm.emergency_phone" class="w-full border border-slate-300 rounded-lg p-2" /></div>
                  <div><label class="block font-medium text-slate-700 mb-1">Hobbies</label>
                    <input x-model="personForm.hobbies" class="w-full border border-slate-300 rounded-lg p-2" /></div>
                  <div><label class="block font-medium text-slate-700 mb-1">Mascotas</label>
                    <input x-model="personForm.pets" class="w-full border border-slate-300 rounded-lg p-2" /></div>
                </div>
              </template>

              <div class="md:col-span-2"><label class="block font-medium text-slate-700 mb-1">Observaciones</label>
                <input x-model="personForm.notes" class="w-full border border-slate-300 rounded-lg p-2" /></div>
              <div class="md:col-span-2 flex gap-2">
                <button @click="savePerson()" class="bg-blue-600 text-white px-5 py-2 rounded-lg text-sm">Guardar</button>
                <button @click="showPersonForm = false" class="bg-slate-200 text-slate-700 px-5 py-2 rounded-lg text-sm">Cancelar</button>
              </div>
            </div>

            <div x-show="view==='vol'" class="bg-white rounded-lg shadow p-3 mb-3 grid grid-cols-1 md:grid-cols-3 gap-3 text-sm">
              <div>
                <label class="block font-medium text-slate-700 mb-1">Filtrar por comisión</label>
                <select x-model="filterCommission" @change="pageVol = 1" class="w-full border border-slate-300 rounded-lg p-2">
                  <option value="">-- Todas --</option>
                  <template x-for="c in commissions" :key="c.id">
                    <option :value="c.id" x-text="c.name"></option>
                  </template>
                </select>
              </div>
              <div class="md:col-span-2">
                <label class="block font-medium text-slate-700 mb-1">Buscar</label>
                <input type="text" x-model="filterSearch" @input="pageVol = 1" placeholder="Nombre, apellido, correo o DNI..." class="w-full border border-slate-300 rounded-lg p-2" />
              </div>
              <div class="md:col-span-3 text-xs text-slate-500">
                Mostrando <span x-text="filteredVols.length"></span> de <span x-text="volunteers.length"></span> personas
              </div>
            </div>

            <div x-show="view==='vol'" class="bg-white rounded-lg shadow overflow-x-auto">
              <table class="min-w-full text-sm">
                <thead class="bg-slate-50 text-left text-slate-600">
                  <tr><th class="p-3">Voluntario</th><th class="p-3">Comisión</th><th class="p-3">Rol</th><th class="p-3">Estado</th><th class="p-3">Ingreso</th><th class="p-3">Acciones</th></tr>
                </thead>
                <tbody>
                  <template x-for="v in pagedVols" :key="v.id">
                    <tr class="border-t">
                      <td class="p-3" x-text="fullName(v)"></td>
                      <td class="p-3" x-text="commissionName(v.commission_id)"></td>
                      <td class="p-3" x-text="v.internal_role || ''"></td>
                      <td class="p-3"><span class="px-2 py-1 rounded text-xs"
                        :class="v.status==='activo' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'"
                        x-text="v.status"></span></td>
                      <td class="p-3" x-text="v.admission_date || ''"></td>
                      <td class="p-3">
                        <button @click="editPerson(v)" class="text-blue-600 text-xs underline mr-2">Ficha completa</button>
                        <button x-show="v.status==='activo'" @click="darBaja(v)" class="text-red-600 text-xs underline mr-2">Baja</button>
                        <button x-show="v.status==='baja'" @click="reactivar(v)" class="text-green-600 text-xs underline">Reactivar</button>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
              <div class="flex items-center justify-end gap-2 p-3 text-sm">
                <button @click="pageVol = Math.max(1, pageVol - 1)" :disabled="pageVol <= 1" class="px-3 py-1 rounded bg-slate-200 disabled:opacity-40">Anterior</button>
                <span x-text="pageVol + ' / ' + totalPagesVols + ' · ' + volunteers.length + ' personas'"></span>
                <button @click="pageVol = Math.min(totalPagesVols, pageVol + 1)" :disabled="pageVol >= totalPagesVols" class="px-3 py-1 rounded bg-slate-200 disabled:opacity-40">Siguiente</button>
              </div>
            </div>

            <div x-show="view==='rep'">
              <div class="flex justify-between items-center mb-3">
                <h2 class="font-bold text-slate-700">Total horas visibles: <span x-text="totalHours(hours)"></span></h2>
                <button @click="exportXLS" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm">Exportar XLS</button>
              </div>
              <div class="bg-white rounded-lg shadow p-4 mb-4">
                <h3 class="text-sm font-semibold text-slate-600 mb-2">Horas por mes y actividad</h3>
                <canvas id="chartHours" height="110"></canvas>
              </div>
              <div class="bg-white rounded-lg shadow overflow-x-auto">
                <table class="min-w-full text-sm">
                  <thead class="bg-slate-50 text-left text-slate-600">
                    <tr><th class="p-3">Fecha</th><th class="p-3">Voluntario</th><th class="p-3">Comisión</th><th class="p-3">Actividad</th><th class="p-3">Horas</th><th class="p-3">Estado</th><th class="p-3"></th></tr>
                  </thead>
                  <tbody>
                    <template x-for="h in pagedHours" :key="h.id">
                      <tr class="border-t">
                        <td class="p-3" x-text="h.entry_date"></td>
                        <td class="p-3" x-text="fullName(h.people)"></td>
                        <td class="p-3" x-text="commissionName(h.commission_id)"></td>
                        <td class="p-3" x-text="h.activities ? h.activities.name : ''"></td>
                        <td class="p-3" x-text="h.hours"></td>
                        <td class="p-3" x-text="h.status"></td>
                        <td class="p-3">
                          <button x-show="h.status==='activo'" @click="annul(h)" class="text-red-600 text-xs underline">Anular</button>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
                <div class="flex items-center justify-end gap-2 p-3 text-sm">
                  <button @click="pageHours = Math.max(1, pageHours - 1)" :disabled="pageHours <= 1" class="px-3 py-1 rounded bg-slate-200 disabled:opacity-40">Anterior</button>
                  <span x-text="pageHours + ' / ' + totalPagesHours"></span>
                  <button @click="pageHours = Math.min(totalPagesHours, pageHours + 1)" :disabled="pageHours >= totalPagesHours" class="px-3 py-1 rounded bg-slate-200 disabled:opacity-40">Siguiente</button>
                </div>
              </div>
            </div>

            <div x-show="view==='cert'">
              <div class="bg-white rounded-lg shadow p-4 grid grid-cols-1 md:grid-cols-5 gap-3 text-sm mb-4">
                <div><label class="block font-medium text-slate-700 mb-1">Comisión</label>
                  <select x-model="certForm.commission_id" @change="onCertCommission()" class="w-full border border-slate-300 rounded-lg p-2">
                    <option value="">-- Todas --</option>
                    <template x-for="c in commissions" :key="c.id">
                      <option :value="c.id" x-text="c.name"></option>
                    </template>
                  </select></div>
                <div><label class="block font-medium text-slate-700 mb-1">Persona</label>
                  <select x-model="certForm.person_id" @change="onCertPerson()" class="w-full border border-slate-300 rounded-lg p-2">
                    <option value="">-- Selecciona --</option>
                    <template x-for="v in certPeople" :key="v.id">
                      <option :value="v.id" x-text="fullName(v)"></option>
                    </template>
                  </select></div>
                <div><label class="block font-medium text-slate-700 mb-1">Desde</label>
                  <input type="date" x-model="certForm.start_date" class="w-full border border-slate-300 rounded-lg p-2" /></div>
                <div><label class="block font-medium text-slate-700 mb-1">Hasta</label>
                  <input type="date" x-model="certForm.end_date" :max="today" class="w-full border border-slate-300 rounded-lg p-2" /></div>
                <div class="flex flex-col justify-end">
                  <button @click="generateCert()" :disabled="!certHasHours"
                    :class="certHasHours ? 'bg-blue-600 hover:bg-blue-700' : 'bg-slate-300 cursor-not-allowed'"
                    class="text-white px-5 py-2 rounded-lg text-sm w-full">Generar</button>
                  <p x-show="!certHasHours" class="text-xs text-slate-500 mt-1">Se activa solo si la persona tiene horas en el rango.</p>
                </div>
              </div>

              <div x-show="certPreview" class="bg-white rounded-lg shadow p-4 mb-4">
                <div x-html="certHtml()"></div>
                <button @click="printCert()" class="mt-4 bg-blue-600 text-white px-5 py-2 rounded-lg text-sm">Imprimir / PDF</button>
              </div>
            </div>
          </div>
        </template>

        <!-- ============ PANEL COORDINADOR / SUB ============ -->
        <template x-if="isCoordView">
          <div>
            <div class="flex flex-wrap gap-2 mb-4">
              <button @click="view='vol'" :class="view==='vol' ? 'bg-blue-600 text-white' : 'bg-white'" class="px-4 py-2 rounded-lg text-sm font-medium shadow">Mis voluntarios</button>
              <button @click="view='reg'" :class="view==='reg' ? 'bg-blue-600 text-white' : 'bg-white'" class="px-4 py-2 rounded-lg text-sm font-medium shadow">Registrar horas</button>
              <button x-show="isCoordinator" @click="view='auth'" :class="view==='auth' ? 'bg-blue-600 text-white' : 'bg-white'" class="px-4 py-2 rounded-lg text-sm font-medium shadow">Autorizar sub</button>
              <button @click="view='rep'" :class="view==='rep' ? 'bg-blue-600 text-white' : 'bg-white'" class="px-4 py-2 rounded-lg text-sm font-medium shadow">Reporte</button>
            </div>

            <div x-show="view==='vol'" class="bg-white rounded-lg shadow overflow-x-auto">
              <table class="min-w-full text-sm">
                <thead class="bg-slate-50 text-left text-slate-600">
                  <tr><th class="p-3">Voluntario</th><th class="p-3">Rol</th><th class="p-3">Estado</th><th class="p-3">Contacto</th></tr>
                </thead>
                <tbody>
                  <template x-for="v in volunteers" :key="v.id">
                    <tr class="border-t">
                      <td class="p-3" x-text="fullName(v)"></td>
                      <td class="p-3" x-text="v.internal_role || ''"></td>
                      <td class="p-3" x-text="v.status"></td>
                      <td class="p-3" x-text="v.phone || ''"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>

            <div x-show="view==='reg'">
              <template x-if="!canWrite">
                <div class="bg-amber-50 border border-amber-300 text-amber-800 p-4 rounded-lg text-sm">
                  El coordinador de tu comisión aún no te autoriza a registrar horas. Tienes acceso de solo lectura.
                </div>
              </template>
              <template x-if="canWrite">
                <form @submit.prevent="submitHour" class="bg-white rounded-lg shadow p-4 grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                  <div>
                    <label class="block font-medium text-slate-700 mb-1">Voluntario</label>
                    <select x-model="form.volunteer_id" class="w-full border border-slate-300 rounded-lg p-2">
                      <option value="">-- Selecciona --</option>
                      <template x-for="v in activeVols" :key="v.id">
                        <option :value="v.id" x-text="fullName(v)"></option>
                      </template>
                    </select>
                  </div>
                  <div>
                    <label class="block font-medium text-slate-700 mb-1">Actividad</label>
                    <select x-model="form.activity_id" class="w-full border border-slate-300 rounded-lg p-2">
                      <option value="">-- Selecciona --</option>
                      <template x-for="a in activities" :key="a.id">
                        <option :value="a.id" x-text="a.name"></option>
                      </template>
                    </select>
                  </div>
                  <div>
                    <label class="block font-medium text-slate-700 mb-1">Fecha</label>
                    <input type="date" x-model="form.entry_date" :max="today" class="w-full border border-slate-300 rounded-lg p-2" />
                  </div>
                  <div>
                    <label class="block font-medium text-slate-700 mb-1">Horas</label>
                    <input type="number" step="0.25" min="0.25" max="24" x-model="form.hours" class="w-full border border-slate-300 rounded-lg p-2" />
                  </div>
                  <div class="md:col-span-2">
                    <label class="block font-medium text-slate-700 mb-1">Descripción (opcional)</label>
                    <input type="text" x-model="form.description" class="w-full border border-slate-300 rounded-lg p-2" placeholder="Ej: Reunión semanal de comisión" />
                  </div>
                  <div class="md:col-span-2">
                    <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-medium hover:bg-blue-700">Registrar</button>
                  </div>
                </form>
              </template>
            </div>

            <div x-show="view==='auth' && isCoordinator" class="bg-white rounded-lg shadow overflow-x-auto">
              <table class="min-w-full text-sm">
                <thead class="bg-slate-50 text-left text-slate-600">
                  <tr><th class="p-3">Subcoordinador</th><th class="p-3">Puede registrar</th><th class="p-3"></th></tr>
                </thead>
                <tbody>
                  <template x-for="s in subs" :key="s.id">
                    <tr class="border-t">
                      <td class="p-3" x-text="fullName(s.people)"></td>
                      <td class="p-3">
                        <span class="px-2 py-1 rounded text-xs"
                          :class="s.can_write ? 'bg-green-100 text-green-700' : 'bg-slate-100 text-slate-600'"
                          x-text="s.can_write ? 'SÍ' : 'NO'"></span>
                      </td>
                      <td class="p-3">
                        <button @click="toggleSub(s)" class="text-blue-600 text-xs underline"
                          x-text="s.can_write ? 'Revocar' : 'Autorizar'"></button>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>

            <div x-show="view==='rep'">
              <div class="flex justify-between items-center mb-3">
                <h2 class="font-bold text-slate-700">Total horas de mi comisión: <span x-text="totalHours(hours)"></span></h2>
                <button @click="exportXLS" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm">Exportar XLS</button>
              </div>
              <div class="bg-white rounded-lg shadow overflow-x-auto">
                <table class="min-w-full text-sm">
                  <thead class="bg-slate-50 text-left text-slate-600">
                    <tr><th class="p-3">Fecha</th><th class="p-3">Voluntario</th><th class="p-3">Actividad</th><th class="p-3">Horas</th><th class="p-3">Estado</th></tr>
                  </thead>
                  <tbody>
                    <template x-for="h in hours" :key="h.id">
                      <tr class="border-t">
                        <td class="p-3" x-text="h.entry_date"></td>
                        <td class="p-3" x-text="fullName(h.people)"></td>
                        <td class="p-3" x-text="h.activities ? h.activities.name : ''"></td>
                        <td class="p-3" x-text="h.hours"></td>
                        <td class="p-3" x-text="h.status"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </template>

        <!-- ============ PANEL DIRECCIÓN ============ -->
        <template x-if="myRole === 'direccion'">
          <div>
            <div class="flex justify-between items-center mb-3">
              <h2 class="font-bold text-slate-700">Total horas ONG: <span x-text="totalHours(hours)"></span></h2>
              <button @click="exportXLS" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm">Exportar XLS</button>
            </div>
            <div class="bg-white rounded-lg shadow overflow-x-auto">
              <table class="min-w-full text-sm">
                <thead class="bg-slate-50 text-left text-slate-600">
                  <tr><th class="p-3">Fecha</th><th class="p-3">Voluntario</th><th class="p-3">Comisión</th><th class="p-3">Actividad</th><th class="p-3">Horas</th></tr>
                </thead>
                <tbody>
                  <template x-for="h in hours" :key="h.id">
                    <tr class="border-t">
                      <td class="p-3" x-text="h.entry_date"></td>
                      <td class="p-3" x-text="fullName(h.people)"></td>
                      <td class="p-3" x-text="commissionName(h.commission_id)"></td>
                      <td class="p-3" x-text="h.activities ? h.activities.name : ''"></td>
                      <td class="p-3" x-text="h.hours"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>
        </template>

        <!-- ============ PANEL TECNOLOGÍA ============ -->
        <template x-if="myRole === 'tecnologia' && !isCoordView">
          <div>
            <h2 class="text-xl font-bold text-slate-800 mb-4">Panel Tecnología</h2>
            <div class="bg-white p-4 rounded-lg shadow mb-4">
              <p class="text-slate-600 text-sm">Acceso técnico del sistema.</p>
            </div>
            <div class="flex justify-between items-center mb-3">
              <h2 class="font-bold text-slate-700">Horas visibles: <span x-text="totalHours(hours)"></span></h2>
              <button @click="exportXLS" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm">Exportar XLS</button>
            </div>
          </div>
        </template>

      </main>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <script>
    (function () {
      var problemas = [];
      if (!window.supabase) problemas.push('No se cargó la librería Supabase.');
      if (typeof window.app !== 'function') problemas.push('app.js no se ejecutó: verifica que se llame exactamente "app.js", contenga SOLO JavaScript y esté en UTF-8.');
      if (problemas.length) {
        var d = document.getElementById('boot-detail');
        if (d) { d.textContent = problemas.join(' '); d.style.color = '#b91c1c'; }
      }
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</body>
</html>
